    <div id="boot"><div><div class="dot"></div><span id="boot-text">CREANDO UN UNIVERSO</span></div></div>
    <script>
      (function () {
        var l = '';
        try { l = localStorage.getItem('uib.lang') || ''; } catch (e) {}
        if (l !== 'es' && l !== 'en') l = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
        document.documentElement.lang = l;
        if (l === 'en') document.getElementById('boot-text').textContent = 'CREATING A UNIVERSE';
      })();
    </script>
    <noscript>Este juego necesita JavaScript y WebGL. · This game needs JavaScript and WebGL.</noscript>
